# Les valeurs sensibles sont lues depuis l'environnement ou depuis un fichier .env
# (trackit/.env ou trackit/backend/.env), voir .env.example.
spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: trackit
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trackit}?useUnicode=true&characterEncoding=utf8${DB_OPTIONS:}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  # Derrière un proxy (Railway), l'adresse IP réelle du client est lue dans X-Forwarded-For.
  forward-headers-strategy: native
  error:
    # Les erreurs non gérées de Spring (/error) ne révèlent pas leur message technique.
    # Nos messages métier (ApiException, validation, sécurité) sont écrits par GlobalExceptionHandler
    # et SecurityConfig, indépendamment de ce réglage.
    include-message: never

# Documentation de l'API : désactivée par défaut (production), activée par SWAGGER_ENABLED=true.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

trackit:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Protection contre la force brute sur la connexion
  connexion:
    max-echecs-compte: 5      # échecs avant blocage d'un compte (adresse e-mail)
    max-echecs-adresse: 20    # échecs avant blocage d'une adresse IP
    duree-minutes: 15         # fenêtre de comptage et durée du blocage
    max-inscriptions-adresse: 5     # inscriptions d'organisations autorisées par adresse IP…
    fenetre-inscription-minutes: 60 # … sur cette fenêtre (au-delà : 429)
  storage:
    uploads-dir: ${UPLOADS_DIR:./uploads}
    reports-dir: ${REPORTS_DIR:./reports}
  # Délais cibles de prise en charge et de résolution, en heures, par niveau de priorité
  sla:
    heures-par-niveau:
      1: 168
      2: 72
      3: 24
      4: 4
    # Escalade automatique des anomalies hors délai aux responsables techniques (une seule fois)
    escalade-active: true
    intervalle-escalade: PT15M
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: eur
    offres:
      - code: PREMIUM_MENSUEL
        libelle: Premium mensuel
        montant: 29.00
        duree-mois: 1
      - code: PREMIUM_ANNUEL
        libelle: Premium annuel
        montant: 290.00
        duree-mois: 12
