# Profil « test » : base H2 en mémoire (mode MySQL), schéma créé par Hibernate.
spring:
  datasource:
    url: jdbc:h2:mem:trackit;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

trackit:
  jwt:
    secret: cle-de-test-uniquement-0123456789-abcdefghijklmnopqrstuvwxyz
  storage:
    uploads-dir: ./target/test-uploads
    reports-dir: ./target/test-reports
  stripe:
    secret-key: ""
    webhook-secret: ""
